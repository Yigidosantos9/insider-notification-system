services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    # Not published on the host to avoid clashing with a local PostgreSQL.
    # Inspect with: docker compose exec postgres psql -U notifier
    # Uncomment to run the api/worker from the host (make run-api):
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://notifier:notifier@postgres:5432/notifier?sslmode=disable
      PROVIDER_URL: ${PROVIDER_URL:-http://mock-provider:9090/send}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-5s}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      CLAIM_BATCH: ${CLAIM_BATCH:-50}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      RETRY_BASE: ${RETRY_BASE:-2s}
      RETRY_CAP: ${RETRY_CAP:-5m}
      BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-5}
      BREAKER_COOLDOWN: ${BREAKER_COOLDOWN:-30s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "9091:9091"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_started
    restart: unless-stopped

  mock-provider:
    build: .
    entrypoint: ["/usr/local/bin/mockprovider"]
    environment:
      FAIL_RATE: ${MOCK_FAIL_RATE:-0}
      RATE_429: ${MOCK_RATE_429:-0}
      LATENCY_MS: ${MOCK_LATENCY_MS:-20}
    ports:
      - "9090:9090"

volumes:
  pgdata:
